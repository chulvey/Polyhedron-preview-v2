<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polyhedron Preconstructed</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .logo{
      position:fixed;
      top:8px;
      left:8px;
      width:64px;
      z-index:30;
    }

    .page{
      max-width:980px;
      margin:0 auto;
      padding:0 20px 0;
    }

    .hero{
      position:relative;
      margin-top:0;
      margin-bottom:0;
    }

    .heroFrame{
      border:1px solid rgba(255,255,255,.20);
      border-radius:20px;
      overflow:hidden;
      background:#050505;
      box-shadow:0 0 30px rgba(199,255,94,.08);
    }

    .heroImage{
      display:block;
      width:100%;
      height:220px;
      object-fit:cover;
      object-position:center;
    }

    .menuButton{
      position:fixed;
      top:10px;
      right:10px;
      z-index:40;
      width:52px;
      height:52px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(5,5,5,.86);
      color:#c7ff5e;
      font-size:28px;
      line-height:1;
      cursor:pointer;
    }

    .menuPanel{
      position:fixed;
      top:0;
      right:-360px;
      width:min(340px,86vw);
      height:100vh;
      z-index:50;
      background:#050505;
      border-left:1px solid rgba(199,255,94,0.18);
      box-shadow:-12px 0 36px rgba(0,0,0,.45);
      transition:right .2s ease;
      padding:22px 18px 90px;
      overflow:auto;
    }

    .menuPanel.open{
      right:0;
    }

    .menuPanel h2{
      color:#c7ff5e;
      margin:8px 0 18px;
      font-size:24px;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    }

    .menuPanel a{
      display:block;
      color:#ffffff;
      text-decoration:none;
      padding:10px 0;
      border-bottom:1px solid rgba(255,255,255,.06);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    }

    .menuPanel a.active{
      color:#c7ff5e;
      font-weight:700;
    }

    .menuShade{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.45);
      z-index:45;
      display:none;
    }

    .menuShade.open{
      display:block;
    }

    .closeRow{
      display:flex;
      justify-content:flex-end;
    }

    .closeButton{
      border:none;
      background:transparent;
      color:#c7ff5e;
      font-size:30px;
      line-height:1;
      padding:0 0 8px;
      cursor:pointer;
    }

    @media (max-width:700px){
      .page{padding:0 16px 0;}
      .heroImage{height:180px;}
    }
  </style>
</head>
<body>
  <img class="logo" src="PolyhedronLogo_Main.png" alt="Polyhedron logo">

  <div class="page">
    <div class="hero">
      <div class="heroFrame">
        <img class="heroImage" src="PolyhedronPrecon_HeroBanner.jpg" alt="Polyhedron precon decks banner">
      </div>
    </div>
  </div>

  <section class="rarity-columns" aria-label="Deck select">
    <div class="rarity-column">
      <div class="rarity-header silver">Beginner</div>
      <div class="deck-list" id="col-beginner"></div>
    </div>

    <div class="rarity-column">
      <div class="rarity-header gold">Advanced</div>
      <div class="deck-list" id="col-advanced"></div>
    </div>

    <div class="rarity-column">
      <div class="rarity-header orange">Expert</div>
      <div class="deck-list" id="col-expert"></div>
    </div>
  </section>

  <footer class="progress-container" aria-label="Unlock progress">
    <div class="progress-pill" role="progressbar" aria-valuemin="0" aria-valuemax="64" aria-valuenow="4">
      <div class="progress-fill" id="progressFill"></div>
      <div class="progress-text" id="progressText">Progress: 4 / 64 unlocked</div>
      <div class="progress-subtext" id="progressSubtext">Live decks: 44 (from workbook)</div>
    </div>
  </footer>

  <button class="menuButton" aria-label="Open site menu" onclick="toggleFrameworkMenu(true)">☰</button>
  <div id="frameworkShade" class="menuShade" onclick="toggleFrameworkMenu(false)"></div>
  <aside id="frameworkMenu" class="menuPanel" aria-label="Site navigation">
    <div class="closeRow"><button class="closeButton" aria-label="Close site menu" onclick="toggleFrameworkMenu(false)">×</button></div>
    <h2>Polyhedron</h2>
    <a href="index.html" class="active">Deck Select</a>
    <a href="framework/index.html">Learning Framework</a>
    <a href="https://chulvey.github.io/Commander-battle-sim/" target="_blank" rel="noopener noreferrer">Live Game</a>
  </aside>

  <script>
    window.POLYHEDRON = {
      ART_ENABLED: true,
      PLACEHOLDER_DATA_URI: "data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22250%22%20height%3D%22350%22%20viewBox%3D%220%200%20250%20350%22%3E%0A%20%20%3Cdefs%3E%0A%20%20%20%20%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23101010%22/%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23050505%22/%3E%0A%20%20%20%20%3C/linearGradient%3E%0A%20%20%3C/defs%3E%0A%20%20%3Crect%20x%3D%226%22%20y%3D%226%22%20width%3D%22238%22%20height%3D%22338%22%20rx%3D%2214%22%20fill%3D%22url%28%23g%29%22%20stroke%3D%22%23ccff00%22%20stroke-width%3D%223%22/%3E%0A%20%20%3Ctext%20x%3D%22125%22%20y%3D%22170%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%22%20font-size%3D%2216%22%20fill%3D%22%23ccff00%22%3ECHIBI%3C/text%3E%0A%20%20%3Ctext%20x%3D%22125%22%20y%3D%22194%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%22%20font-size%3D%2212%22%20fill%3D%22%239fbf00%22%3Eplaceholder%3C/text%3E%0A%3C/svg%3E",
      HOLD_MS: 220
    };
  </script>
  <script src="framework/menu.js"></script>
  <script src="app.js"></script>
</body>
</html>
